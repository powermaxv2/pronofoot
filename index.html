<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PronoFoot - Pronostics de Football en Temps Réel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <h1 class="logo">⚽ PronoFoot</h1>
        <p class="tagline">Pronostics Football en Temps Réel</p>
      </div>
      <div class="api-status">
        <span class="status-dot"></span>
        <span>API Active</span>
      </div>
    </header>

    <!-- Filtres -->
    <div class="filters-section">
      <div class="filters">
        <div class="filter-group">
          <label for="league-filter">🏆 Ligue:</label>
          <select id="league-filter">
            <option value="ALL">Toutes les ligues</option>
          </select>
        </div>
        
        <div class="filter-group">
          <label for="status-filter">📊 Statut:</label>
          <select id="status-filter">
            <option value="ALL">Tous les matchs</option>
            <option value="SCHEDULED">⏰ À venir</option>
            <option value="LIVE">🔴 En direct</option>
            <option value="FINISHED">✅ Terminés</option>
          </select>
        </div>

        <button id="refresh-btn" class="refresh-btn">🔄 Actualiser</button>
      </div>
    </div>

    <!-- Conteneur des matchs -->
    <main class="main-content">
      <div id="matches-container" class="matches-container">
        <p class="loading">⏳ Chargement des matchs...</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>📊 Données en temps réel via Football-Data.org | Actualisation auto toutes les 60 secondes</p>
      <p>⚠️ PronoFoot est à titre informatif. Pas de responsabilité sur les paris.</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
