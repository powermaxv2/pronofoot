# PronoFoot — production (Raspberry Pi 5 / ARM64 ou x86_64).
#   docker compose up -d --build            → application sur http://<machine>:3000
#   docker compose --profile https up -d    → + Caddy (HTTPS automatique, variable DOMAIN)
#   docker compose run --rm migrate pnpm db:seed   → jeu de démonstration (base vide)
name: pronofoot

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-pronofoot}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/${POSTGRES_DB:-pronofoot}
  APP_URL: ${APP_URL:?APP_URL manquant}
  AUTH_URL: ${APP_URL}
  AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET manquant}
  AUTH_TRUST_HOST: "true"
  EMAIL_SERVER: ${EMAIL_SERVER:-}
  EMAIL_FROM: ${EMAIL_FROM:-PronoFoot <no-reply@pronofoot.local>}
  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
  API_FOOTBALL_DAILY_BUDGET: ${API_FOOTBALL_DAILY_BUDGET:-90}
  FOOTBALL_DATA_KEY: ${FOOTBALL_DATA_KEY:-}
  FOOTBALL_DATA_MINUTE_BUDGET: ${FOOTBALL_DATA_MINUTE_BUDGET:-9}
  FOOTBALL_LIVE_PROVIDER: ${FOOTBALL_LIVE_PROVIDER:-football-data}
  FOOTBALL_SEASON: ${FOOTBALL_SEASON:-}
  NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@pronofoot.local}
  UPLOAD_DIR: /data/uploads
  TZ: Europe/Paris

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pronofoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-pronofoot}
      TZ: Europe/Paris
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Limites adaptées à un Raspberry Pi (4–8 Go).
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60"]

  migrate:
    build: { context: ., target: tools }
    image: pronofoot-tools
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  web:
    build: { context: ., target: runner }
    image: pronofoot
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - uploads:/data
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    image: pronofoot
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    environment: *app-env
    volumes:
      - uploads:/data
    healthcheck:
      disable: true
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      web: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN manquant pour le profil https}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
